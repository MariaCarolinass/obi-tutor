[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obi-tutor"
version = "0.1.0"
description = "Sistema Tutor Inteligente para aprendizagem de programação inspirado na OBI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
